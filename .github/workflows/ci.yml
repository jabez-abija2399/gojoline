name: CI

on:
  push:
    branches: [main, "build/**", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Lighthouse CI (mobile budgets from docs/QUALITY.md)
        run: npx --yes @lhci/cli@0.16.1 autorun

  site-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: JS budget (100 KB gzip)
        run: |
          size=$(cat dist/assets/*.js | gzip -9 | wc -c)
          echo "site JS gzip: $size bytes"
          test "$size" -le 102400
      # Styles that bundle extra code (the pointer script, the app drawings) are checked too.
      - name: JS budget per style that adds code
        run: |
          cp src/site.json /tmp/site.json.bak
          for preset in agency folio software; do
            cp "presets/$preset.json" src/site.json
            npm run build > /dev/null
            size=$(cat dist/assets/*.js | gzip -9 | wc -c)
            echo "$preset JS gzip: $size bytes"
            test "$size" -le 102400
          done
          cp /tmp/site.json.bak src/site.json
