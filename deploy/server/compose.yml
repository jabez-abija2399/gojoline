# Gojoline on one server: the app (built from this repo's Dockerfile) behind Caddy (HTTPS).
# Started and updated by setup.sh / update.sh; see README.md.
services:
  app:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    image: gojoline-app
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"
    # Room for the build on the same 4 GB server: the running app can never take it all.
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
