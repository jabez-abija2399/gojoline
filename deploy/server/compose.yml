# Gojoline on one server: the app (built from this repo's Dockerfile) behind Caddy (HTTPS).
# Started and updated by setup.sh / update.sh; see README.md.
services:
  app:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    image: gojoline-app
    env_file: .env
    environment:
      # Site workspaces run in Docker through the runner; their previews live on their own origin.
      SANDBOX_RUNNER_URL: http://runner:7070
      CSP_FRAME_ORIGINS: https://*.preview.${APP_DOMAIN}
      # Admin → Posts videos (deploy/server/renderer), with their own secret (setup.sh makes it).
      RENDERER_URL: http://renderer:7071
      RENDERER_SECRET: ${RENDERER_SECRET:-}
    restart: unless-stopped
    depends_on: [runner, renderer]
    networks: [default, render]
    expose:
      - "3000"
    # Room for builds and site workspaces on the same 4 GB server.
    mem_limit: 1280m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The only service with Docker access: starts and controls one workspace container per site
  # (deploy/server/runner). Reachable only on this private network, with a shared secret.
  runner:
    build: ./runner
    image: gojoline-runner
    restart: unless-stopped
    environment:
      RUNNER_SECRET: ${SANDBOX_RUNNER_SECRET:-}
      APP_DOMAIN: ${APP_DOMAIN}
      SANDBOX_IMAGE: gojoline-sandbox
      SANDBOX_NETWORK: gojoline-previews
      SANDBOX_MAX_RUNNING: "2"
      SANDBOX_MEMORY: 700m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "7070"
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /root]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Films public pages into post videos (Admin → Posts): Chromium + ffmpeg, one video at a time.
  # On its own network: only the app reaches it, never the runner (Docker) or the site workspaces.
  # Every page request is fetched by Node with its address checked and pinned (server.ts), and
  # the host firewall drops this network's traffic to private ranges (setup.sh).
  renderer:
    build: ./renderer
    image: gojoline-renderer
    restart: unless-stopped
    networks: [render]
    environment:
      RENDERER_SECRET: ${RENDERER_SECRET:-}
    expose:
      - "7071"
    # One CPU at most and room for Chromium and ffmpeg while a video is made.
    cpus: "1.0"
    mem_limit: 700m
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on: [app]
    networks: [default, previews]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # The renderer's network: internet access for filming public pages, a fixed range so the host
  # firewall can refuse its traffic to private addresses (setup.sh).
  render:
    name: gojoline-render
    ipam:
      config:
        - subnet: 172.30.250.0/24
  # Site workspaces live here: no internet (internal), reachable only by Caddy for their previews.
  previews:
    name: gojoline-previews
    internal: true
    # A fixed range, so Caddy can refuse app requests coming from a workspace.
    ipam:
      config:
        - subnet: 172.30.240.0/24

volumes:
  caddy_data:
  caddy_config:
