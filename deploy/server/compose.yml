# Gojoline on one server: the app (built from this repo's Dockerfile) behind Caddy (HTTPS).
# Started and updated by setup.sh / update.sh; see README.md.
services:
  app:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    image: gojoline-app
    env_file: .env
    environment:
      # Site workspaces run in Docker through the runner; their previews live on their own origin.
      SANDBOX_RUNNER_URL: http://runner:7070
      CSP_FRAME_ORIGINS: https://*.preview.${APP_DOMAIN}
      # Admin → Posts videos (deploy/server/renderer), with their own secret (setup.sh makes it).
      RENDERER_URL: http://renderer:7071
      RENDERER_SECRET: ${RENDERER_SECRET:-}
      # Customer sites (with PUBLISH_PROVIDER=server in .env): written here, served by Caddy.
      SITES_DIR: /srv/sites
      # The DNS token is Caddy's alone (kept out of the app); the app only learns it is set.
      CLOUDFLARE_DNS_API_TOKEN: ""
      SITES_WILDCARD_TLS: ${CLOUDFLARE_DNS_API_TOKEN:+1}
    volumes:
      - sites:/srv/sites
    restart: unless-stopped
    depends_on:
      runner:
        condition: service_started
      renderer:
        condition: service_started
      volumes-init:
        condition: service_completed_successfully
    networks: [default, render]
    expose:
      - "3000"
    # Room for builds and site workspaces on the same 4 GB server.
    mem_limit: 1280m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Gives each volume to the user that writes it, before the services start; nothing else:
  # the sites volume to the app (uid 1000), Caddy's certificates and settings to Caddy (10001,
  # it no longer runs as root; certificates it got as root are kept).
  volumes-init:
    image: gojoline-app
    pull_policy: never
    user: root
    entrypoint: ["sh", "-c", "chown node:node /srv/sites && chown -R 10001:10001 /caddy/data /caddy/config"]
    volumes:
      - sites:/srv/sites
      - caddy_data:/caddy/data
      - caddy_config:/caddy/config
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]

  # The only service with Docker access: starts and controls one workspace container per site
  # (deploy/server/runner). Reachable only on this private network, with a shared secret.
  runner:
    build: ./runner
    image: gojoline-runner
    restart: unless-stopped
    environment:
      RUNNER_SECRET: ${SANDBOX_RUNNER_SECRET:-}
      APP_DOMAIN: ${APP_DOMAIN}
      SANDBOX_IMAGE: gojoline-sandbox
      SANDBOX_NETWORK: gojoline-previews
      SANDBOX_MAX_RUNNING: "2"
      SANDBOX_MEMORY: 700m
      # Caddy's certificate check for customer sites: only live ones (read-only look at the volume).
      SITES_DIR: /srv/sites
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sites:/srv/sites:ro
    expose:
      - "7070"
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /root]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Films public pages into post videos (Admin → Posts): Chromium + ffmpeg, one video at a time.
  # On its own network: only the app reaches it, never the runner (Docker) or the site workspaces.
  # Every page request is fetched by Node with its address checked and pinned (server.ts), and
  # the host firewall drops this network's traffic to private ranges (setup.sh).
  renderer:
    build: ./renderer
    image: gojoline-renderer
    restart: unless-stopped
    networks: [render]
    environment:
      RENDERER_SECRET: ${RENDERER_SECRET:-}
    expose:
      - "7071"
    # One CPU at most and room for Chromium and ffmpeg while a video is made.
    cpus: "1.0"
    mem_limit: 700m
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    # The official Caddy, or with the Cloudflare DNS module when CLOUDFLARE_DNS_API_TOKEN is set
    # (one wildcard certificate for customer sites); see caddy/Dockerfile.
    build:
      context: ./caddy
      args:
        CADDY_FLAVOR: plain${CLOUDFLARE_DNS_API_TOKEN:+-dns}
    image: gojoline-caddy
    pull_policy: build
    restart: unless-stopped
    mem_limit: 256m
    # Not root: its own user (volumes given to it by volumes-init); ports 80/443 open to it
    # through the container's own network setting, not a capability.
    user: "10001:10001"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      app:
        condition: service_started
      volumes-init:
        condition: service_completed_successfully
    networks: [default, previews]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      # Customer sites at https://<slug>.<PUBLISH_BASE_DOMAIN> (a name that never resolves when unset).
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-sites.invalid}
      # Where sites' forms post (their CSP allows only this besides themselves): the app's own origin.
      SITES_API_ORIGIN: ${DATA_API_ORIGIN:-https://${APP_DOMAIN}}
      # tls (on demand per site) or tls-wildcard (DNS-01 with the token below).
      SITES_TLS: tls${CLOUDFLARE_DNS_API_TOKEN:+-wildcard}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - sites:/srv/sites:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # The renderer's network: internet access for filming public pages, a fixed range so the host
  # firewall can refuse its traffic to private addresses (setup.sh).
  render:
    name: gojoline-render
    ipam:
      config:
        - subnet: 172.30.250.0/24
  # Site workspaces live here: no internet (internal), reachable only by Caddy for their previews.
  previews:
    name: gojoline-previews
    internal: true
    # A fixed range, so Caddy can refuse app requests coming from a workspace.
    ipam:
      config:
        - subnet: 172.30.240.0/24

volumes:
  caddy_data:
  caddy_config:
  # Published customer sites (lib/providers/publish/server.ts). Never delete it: it is the live sites.
  sites:
    name: gojoline-sites
