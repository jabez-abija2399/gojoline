<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="light dark">
<title>Offline · Gojoline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF9F6;color:#121212;font-family:system-ui,"Noto Sans Ethiopic",sans-serif;line-height:1.6;padding:24px;box-sizing:border-box}
  main{max-width:28rem;text-align:center}
  img{height:44px;width:auto}
  h1{font-size:1.5rem;margin:16px 0 8px}
  p{margin:0 0 12px;color:#5F5A53}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;margin-top:12px;border-radius:999px;background:#FF5B35;color:#121212;font-weight:600;text-decoration:none}
  a:focus-visible{outline:3px solid #C2370F;outline-offset:3px}
  @media (prefers-color-scheme:dark){
    body{background:#121110;color:#FBF9F6}
    p{color:#A8A196}
    a:focus-visible{outline-color:#FF8A6B}
  }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="/brand/logo-reversed.svg" media="(prefers-color-scheme: dark)">
    <img src="/brand/logo.svg" alt="Gojoline" width="172" height="44">
  </picture>
  <h1>You're offline</h1>
  <p>Gojoline needs an internet connection. Your sites and changes are saved; try again when you're back online.</p>
  <h1 lang="am">ኢንተርኔት የለም</h1>
  <p lang="am">ጎጆላይን ኢንተርኔት ያስፈልገዋል። ድረ-ገጾችዎ እና ለውጦችዎ ተቀምጠዋል፤ ኢንተርኔት ሲመለስ እንደገና ይሞክሩ።</p>
  <a href="/">Try again · እንደገና ይሞክሩ</a>
</main>
</body>
</html>
